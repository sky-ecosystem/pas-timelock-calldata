[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
optimizer = true
optimizer_runs = 200
ignored_warnings_from = ["lib/diamond-pau/lib/openzeppelin-contracts/", "lib/forge-std/"]

remappings = [
  "@openzeppelin/contracts/=lib/diamond-pau/lib/openzeppelin-contracts/contracts/",
  "pas/dss-test/=lib/pas/lib/dss-test/src/",
  "pas/=lib/pas/src/",
  "diamond-pau-test/=lib/diamond-pau/test/",
]

[lint]
lint_on_build = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
