[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
optimizer = true
optimizer_runs = 200
ignored_warnings_from = ["lib/diamond-pau/lib/openzeppelin-contracts/", "lib/forge-std/"]

remappings = [
  "@openzeppelin/contracts/=lib/diamond-pau/lib/openzeppelin-contracts/contracts/",
  "pas/dss-test/=lib/pas/lib/dss-test/src/",
  "pas/deploy/=lib/pas/deploy/",
  "pas/timelock/=lib/pas/src/timelock/",
  "pas/BeamState.sol=lib/pas/src/BeamState.sol",
  "pas/Configurator.sol=lib/pas/src/Configurator.sol",
  "pas/PASMom.sol=lib/pas/src/PASMom.sol",
  "diamond-pau-test/=lib/diamond-pau/test/",
]

[lint]
lint_on_build = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
